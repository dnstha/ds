<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100" height="100">
  <!-- Background -->
  <rect width="500" height="500" fill="#121826"/>

  <!-- Outer Equilateral Triangle with Pointy Vertices Only -->
  <polygon points="250,76.795 450,423.205 50,423.205" fill="none" stroke="#CFFFEE" stroke-width="16" stroke-linejoin="miter" stroke-miterlimit="10"/>

  <!-- Vertical Altitude Line -->
  <line x1="250" y1="76.795" x2="250" y2="423.205" stroke="#CFFFEE" stroke-width="16" stroke-linecap="round"/>

  <!-- Inner Triangles' Shared Slanted Edges (Seamlessly Joined at Base Midpoint) -->
  <polyline points="150,250 250,423.205 350,250" fill="none" stroke="#CFFFEE" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Geometric Arc -->
  <path d="M 150 250 A 200 200 0 0 1 350 250" fill="none" stroke="#CFFFEE" stroke-width="16" stroke-linecap="round"/>
</svg>
